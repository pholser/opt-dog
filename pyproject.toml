[project]
name = "optdog"
version = "0.1.0"
description = "Judging-program (ring schedule) optimizer for AKC all-breed conformation shows"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11", "ortools>=9.15"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/optdog"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The CP-SAT model keeps fixed decisions as Python constants (True/False/ints) in the slots its
# literals and expressions use, which OR-Tools' stubs cannot express. Its domain inputs are typed.
module = ["optdog.solve.cpsat"]
ignore_errors = true
